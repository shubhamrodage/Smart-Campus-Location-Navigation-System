<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Buildings - Smart Campus Navigator</title>

    <script src="js/auth.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6fa;
            color: #172033;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            height: 72px;

            background: linear-gradient(
                135deg,
                #123a91,
                #07549a,
                #0c67b7
            );

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            color: white;

            box-shadow:
                0 5px 20px rgba(0, 50, 120, 0.18);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .navbar nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar nav a {
            text-decoration: none;
            color: white;

            padding: 10px 18px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .navbar nav a:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .logout-btn {
            border: none;

            background: white;
            color: #123a91;

            padding: 10px 18px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(0,0,0,0.15);
        }

        /* MAIN */

        .buildings-container {
            width: 88%;
            max-width: 1200px;

            margin: auto;

            padding: 35px 0 70px;
        }

        /* BACK */

        .back-section {
            margin-bottom: 25px;
        }

        .back-section a {
            text-decoration: none;

            color: #1456a0;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .back-section a:hover {
            color: #0b3c78;
            margin-left: 4px;
        }

        /* HEADING */

        .page-heading {
            text-align: center;

            margin-bottom: 45px;

            animation: fadeUp 0.7s ease;
        }

        .main-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #123a91,
                    #0c67b7
                );

            color: white;

            font-size: 30px;

            box-shadow:
                0 12px 30px rgba(18,58,145,0.25);

            animation:
                floatIcon 3s ease-in-out infinite;
        }

        .page-heading h1 {
            font-size: 34px;

            color: #123a91;

            margin-bottom: 10px;
        }

        .page-heading p {
            color: #687386;

            font-size: 16px;
        }

        /* BUILDING GRID */

        .buildings-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;

            animation: fadeUp 0.9s ease;
        }

        /* BUILDING CARD */

        .building-card {
            background: white;

            border-radius: 20px;

            padding: 28px;

            border: 1px solid #e3e8f0;

            box-shadow:
                0 9px 28px rgba(20,40,80,0.07);

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
        }

        .building-card:hover {
            transform: translateY(-7px);

            border-color: #b9d2f2;

            box-shadow:
                0 18px 38px rgba(18,58,145,0.14);
        }

        /* CARD HEADER */

        .building-header {
            display: flex;

            align-items: center;

            gap: 17px;

            margin-bottom: 20px;
        }

        .building-icon {
            width: 58px;
            height: 58px;

            min-width: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: #edf4ff;

            font-size: 27px;
        }

        .building-header h2 {
            color: #183c73;

            font-size: 22px;

            margin-bottom: 6px;
        }

        .building-code {
            display: inline-block;

            padding: 5px 10px;

            background: #eaf3ff;

            color: #1764b0;

            border-radius: 20px;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1px;
        }

        /* INFO */

        .building-info {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }

        .info-box {
            background: #f7f9fc;

            border: 1px solid #e7ebf2;

            border-radius: 10px;

            padding: 13px;
        }

        .info-box span {
            display: block;

            color: #7a8596;

            font-size: 11px;

            margin-bottom: 5px;

            font-weight: 600;
        }

        .info-box strong {
            color: #243b63;

            font-size: 14px;
        }

        /* DESCRIPTION */

        .building-description {
            background: #f8faff;

            border-left: 4px solid #1456a0;

            padding: 14px 16px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        .building-description h4 {
            color: #123a91;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .building-description p {
            color: #687386;

            font-size: 13px;

            line-height: 1.6;
        }

        /* ACTIONS */

        .building-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .building-btn {
            flex: 1;

            min-width: 140px;

            text-align: center;

            padding: 11px 15px;

            border-radius: 8px;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #123a91,
                    #0c67b7
                );

            color: white;

            transition: 0.3s ease;
        }

        .building-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 16px rgba(18,58,145,0.22);
        }

        .navigate-btn {
            background: white;

            color: #123a91;

            border: 1px solid #123a91;
        }

        .navigate-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #123a91,
                    #0c67b7
                );

            color: white;
        }

        /* LOADING */

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px;

            background: white;

            border-radius: 18px;

            color: #123a91;

            box-shadow:
                0 8px 25px rgba(20,40,80,0.07);
        }

        .loading p {
            color: #758094;

            margin-top: 8px;
        }

        /* ERROR */

        .error {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px;

            background: #fff;

            border-radius: 18px;

            border: 1px solid #e4e9f1;
        }

        .error h3 {
            color: #123a91;

            margin-bottom: 8px;
        }

        .error p {
            color: #758094;
        }

        /* FOOTER */

        footer {
            background:
                linear-gradient(
                    135deg,
                    #123a91,
                    #07549a,
                    #0c67b7
                );

            color: white;

            text-align: center;

            padding: 30px 20px;
        }

        footer h3 {
            font-size: 18px;

            margin-bottom: 7px;
        }

        footer p {
            font-size: 13px;

            opacity: 0.85;
        }

        /* ANIMATIONS */

        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }

        @keyframes floatIcon {

            0%, 100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-6px);
            }

        }

        /* TABLET */

        @media (max-width: 850px) {

            .buildings-grid {
                grid-template-columns: 1fr;
            }

        }

        /* MOBILE */

        @media (max-width: 650px) {

            .navbar {
                height: auto;

                padding: 15px 5%;

                flex-direction: column;

                gap: 12px;
            }

            .logo {
                font-size: 19px;
            }

            .navbar nav {
                flex-wrap: wrap;

                justify-content: center;
            }

            .navbar nav a,
            .logout-btn {
                padding: 8px 12px;

                font-size: 12px;
            }

            .buildings-container {
                width: 92%;

                padding-top: 25px;
            }

            .page-heading h1 {
                font-size: 28px;
            }

            .page-heading p {
                font-size: 14px;
            }

            .building-card {
                padding: 22px;
            }

            .building-info {
                grid-template-columns: 1fr;
            }

            .building-actions {
                flex-direction: column;
            }

            .building-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="navbar">

        <div class="logo">
            🏫 Smart Campus
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="index.html">
                Home
            </a>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </nav>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="buildings-container">


        <!-- BACK -->

        <div class="back-section">

            <a href="dashboard.html">
                ← Back to Dashboard
            </a>

        </div>


        <!-- HEADING -->

        <section class="page-heading">

            <div class="main-icon">
                🏢
            </div>

            <h1>
                Campus Buildings
            </h1>

            <p>
                Explore all buildings, blocks, floors and campus information.
            </p>

        </section>


        <!-- BUILDINGS -->

        <section
            id="buildingsGrid"
            class="buildings-grid"
        >

            <div class="loading">

                <h3>
                    🔄 Loading Buildings...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <h3>
            🏫 Smart Campus Navigator
        </h3>

        <p>
            Smart way to explore your campus.
        </p>

    </footer>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        /* LOGIN CHECK */

        if (typeof checkLogin === "function") {

            checkLogin();

        }


        /* API */

        const API_URL =
            "http://127.0.0.1:8080/api/buildings";


        /* LOAD BUILDINGS */

        async function loadBuildings() {

            const buildingsGrid =
                document.getElementById(
                    "buildingsGrid"
                );


            try {

                const response =
                    await fetch(
                        API_URL + "?t=" + Date.now()
                    );


                if (!response.ok) {

                    throw new Error(
                        "API request failed"
                    );

                }


                const data =
                    await response.json();


                const buildings =
                    data.buildings || [];


                if (buildings.length === 0) {

                    buildingsGrid.innerHTML = `

                        <div class="error">

                            <h3>
                                🏢 No Buildings Found
                            </h3>

                            <p>
                                No campus buildings are available.
                            </p>

                        </div>

                    `;

                    return;

                }


                displayBuildings(buildings);

            }


            catch (error) {

                console.error(
                    "Building API Error:",
                    error
                );


                buildingsGrid.innerHTML = `

                    <div class="error">

                        <h3>
                            ⚠️ Unable to Load Buildings
                        </h3>

                        <p>
                            Please make sure the backend server is running.
                        </p>

                    </div>

                `;

            }

        }


        /* DISPLAY BUILDINGS */

        function displayBuildings(buildings) {

            const buildingsGrid =
                document.getElementById(
                    "buildingsGrid"
                );


            let html = "";


            for (
                let i = 0;
                i < buildings.length;
                i++
            ) {

                const building =
                    buildings[i];


                html += `

                    <div class="building-card">

                        <div class="building-header">

                            <div class="building-icon">
                                🏢
                            </div>

                            <div>

                                <h2>
                                    ${building.code === "B"
                                        ? "Building B"
                                        : building.name}
                                </h2>

                                <span class="building-code">

                                    BUILDING ${building.code}

                                </span>

                            </div>

                        </div>


                        <div class="building-info">

                            <div class="info-box">

                                <span>
                                    Building ID
                                </span>

                                <strong>
                                    ${building.id}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Building Code
                                </span>

                                <strong>
                                    ${building.code}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Total Floors
                                </span>

                                <strong>
                                    ${building.floors}
                                </strong>

                            </div>


                            <div class="info-box">

                                <span>
                                    Campus Block
                                </span>

                                <strong>
                                    ${building.code}
                                </strong>

                            </div>

                        </div>


                        <div class="building-description">

                            <h4>
                                Building Information
                            </h4>

                            <p>
                                ${building.description}
                            </p>

                        </div>


                        <div class="building-actions">

                            <a
                                href="building-details.html?id=${building.id}"
                                class="building-btn"
                            >
                                View Details →
                            </a>

                            <a
                                href="navigation.html?type=building&id=${building.id}"
                                class="building-btn navigate-btn"
                            >
                                🧭 Navigation
                            </a>

                        </div>

                    </div>

                `;

            }


            buildingsGrid.innerHTML =
                html;

        }


        /* LOGOUT */

        function logout() {

            localStorage.removeItem(
                "isLoggedIn"
            );

            localStorage.removeItem(
                "loggedInUserName"
            );

            localStorage.removeItem(
                "smartCampusUser"
            );


            alert(
                "You have been logged out."
            );


            window.location.href =
                "login.html";

        }


        /* START */

        loadBuildings();

    </script>

</body>

</html>
