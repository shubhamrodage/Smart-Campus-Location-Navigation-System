<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location Details | Smart Campus Navigator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #123b78;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #123b78;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            font-size: 10px;
            color: #64748b;
            letter-spacing: 1.2px;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a {
            text-decoration: none;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 8px;
            transition: 0.25s ease;
        }

        .nav-links a:hover {
            background: #eef4ff;
            color: #123b78;
        }

        .logout-btn {
            border: none;
            background: #123b78 !important;
            color: white !important;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #0d2f63 !important;
        }

        /* ================= HERO ================= */

        .hero {
            background: linear-gradient(135deg, #123b78, #1d5fbf);
            padding: 55px 20px 70px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            top: -130px;
            right: 8%;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            bottom: -110px;
            left: 8%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            backdrop-filter: blur(5px);
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .hero p {
            font-size: 15px;
            opacity: 0.88;
        }

        /* ================= MAIN ================= */

        .main-container {
            max-width: 1050px;
            margin: -38px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 5;
        }

        /* ================= DETAILS CARD ================= */

        .details-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
            overflow: hidden;
            animation: fadeUp 0.5s ease;
        }

        .card-header {
            padding: 28px 32px;
            border-bottom: 1px solid #edf0f5;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .location-icon {
            width: 58px;
            height: 58px;
            background: #eef4ff;
            color: #1754a6;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            flex-shrink: 0;
        }

        .card-header h2 {
            font-size: 25px;
            color: #172554;
            margin-bottom: 5px;
        }

        .location-type {
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
        }

        /* ================= INFO GRID ================= */

        .info-section {
            padding: 30px 32px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e8edf3;
            border-radius: 12px;
            padding: 18px;
            transition: 0.25s ease;
        }

        .info-box:hover {
            transform: translateY(-2px);
            border-color: #cbdcf5;
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.05);
        }

        .info-label {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .info-value {
            color: #172554;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            word-break: break-word;
        }

        /* ================= DESCRIPTION ================= */

        .description-section {
            margin-top: 25px;
            padding: 22px;
            border-radius: 13px;
            background: #f8fafc;
            border: 1px solid #e8edf3;
        }

        .description-title {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .description-text {
            color: #334155;
            font-size: 15px;
            line-height: 1.7;
        }

        /* ================= BUTTONS ================= */

        .actions {
            padding: 0 32px 32px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .btn-primary {
            background: #123b78;
            color: white;
            box-shadow: 0 5px 14px rgba(18, 59, 120, 0.18);
        }

        .btn-primary:hover {
            background: #0d2f63;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        /* ================= ERROR ================= */

        .error-card {
            background: white;
            border-radius: 18px;
            padding: 45px 25px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
        }

        .error-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .error-card h2 {
            color: #172554;
            margin-bottom: 8px;
        }

        .error-card p {
            color: #64748b;
            margin-bottom: 20px;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            padding: 28px 20px;
            text-align: center;
        }

        .footer-title {
            color: #123b78;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .footer-text {
            color: #64748b;
            font-size: 13px;
        }

        .copyright {
            margin-top: 12px;
            color: #94a3b8;
            font-size: 11px;
        }

        /* ================= ANIMATION ================= */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 2px;
            }

            .nav-links a {
                padding: 8px 9px;
                font-size: 12px;
            }

            .brand-subtitle {
                display: none;
            }

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h1 {
                font-size: 29px;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                height: auto;
                padding: 14px 18px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .hero {
                padding: 45px 20px 65px;
            }

            .hero h1 {
                font-size: 25px;
            }

            .hero p {
                font-size: 13px;
            }

            .main-container {
                padding: 0 14px;
            }

            .card-header {
                padding: 22px;
            }

            .card-header h2 {
                font-size: 21px;
            }

            .info-section {
                padding: 22px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                padding: 0 22px 22px;
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="dashboard.html" class="brand">

            <div class="brand-icon">
                🏫
            </div>

            <div class="brand-text">
                <span class="brand-title">SMART CAMPUS</span>
                <span class="brand-subtitle">VIT PUNE</span>
            </div>

        </a>

        <div class="nav-links">

            <a href="dashboard.html">Dashboard</a>

            <a href="locations.html">Locations</a>

            <a href="index.html">Home</a>

            <a href="#" class="logout-btn" id="logoutButton">
                Logout
            </a>

        </div>

    </nav>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="hero-content">

            <div class="hero-icon">
                📍
            </div>

            <h1>Smart Campus Navigator</h1>

            <p>
                Location Details
            </p>

        </div>

    </section>


    <!-- ================= MAIN ================= -->

    <main class="main-container">

        <div id="content">

            <!-- Location details will be loaded here -->

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-title">
            🏫 Smart Campus Navigator
        </div>

        <div class="footer-text">
            Smart way to explore your campus.
        </div>

        <div class="copyright">
            © 2026 Smart Campus Navigator. All rights reserved.
        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const API_URL = "http://127.0.0.1:8080/api/locations";

        const params = new URLSearchParams(window.location.search);

        const locationId = params.get("id");

        const content = document.getElementById("content");


        /* ================= AUTH CHECK ================= */

        const isLoggedIn = localStorage.getItem("isLoggedIn");

        if (!isLoggedIn) {

            window.location.href = "login.html";

        }


        /* ================= LOGOUT ================= */

        document.getElementById("logoutButton").addEventListener("click", function (event) {

            event.preventDefault();

            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("loggedInUserName");

            window.location.href = "login.html";

        });


        /* ================= LOAD LOCATION ================= */

        async function loadLocation() {

            if (!locationId) {

                showError("No location selected.");

                return;

            }

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {

                    throw new Error("Unable to connect to backend.");

                }

                const data = await response.json();

                const locations = data.locations || [];

                const location = locations.find(
                    item => String(item.id).trim() === String(locationId).trim()
                );


                if (!location) {

                    showError("Location not found.");

                    return;

                }


                /* ================= DISPLAY ================= */

                content.innerHTML = `

                    <div class="details-card">

                        <div class="card-header">

                            <div class="location-icon">
                                📍
                            </div>

                            <div>

                                <h2>
                                    ${location.name}
                                </h2>

                                <div class="location-type">
                                    ${location.type || "Campus Location"}
                                </div>

                            </div>

                        </div>


                        <div class="info-section">

                            <div class="info-grid">

                                <div class="info-box">

                                    <div class="info-label">
                                        🆔 Location ID
                                    </div>

                                    <div class="info-value">
                                        ${location.id}
                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">
                                        📌 Type
                                    </div>

                                    <div class="info-value">
                                        ${location.type || "N/A"}
                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">
                                        🏢 Building
                                    </div>

                                    <div class="info-value">
                                        ${location.building || "N/A"}
                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">
                                        📶 Floor
                                    </div>

                                    <div class="info-value">
                                        ${location.floor ?? "N/A"}
                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">
                                        🚪 Room
                                    </div>

                                    <div class="info-value">
                                        ${location.room || "N/A"}
                                    </div>

                                </div>


                                <div class="info-box">

                                    <div class="info-label">
                                        🎓 Department
                                    </div>

                                    <div class="info-value">
                                        ${location.department || "N/A"}
                                    </div>

                                </div>

                            </div>


                            <div class="description-section">

                                <div class="description-title">
                                    📝 Description
                                </div>

                                <div class="description-text">
                                    ${location.description || "No description available."}
                                </div>

                            </div>

                        </div>


                        <div class="actions">

                            <!-- UPDATED BACK BUTTON -->

                            <a
                                href="search.html?type=location"
                                class="btn btn-secondary"
                            >
                                ← Back to Location Search
                            </a>


                            <!-- NAVIGATE BUTTON -->

                            <a
                                href="navigation.html?type=location&id=${encodeURIComponent(location.id)}"
                                class="btn btn-primary"
                            >
                                🧭 Navigate
                            </a>

                        </div>

                    </div>

                `;

            }

            catch (error) {

                console.error(error);

                showError(
                    "Unable to load location details. Please make sure the backend server is running."
                );

            }

        }


        /* ================= ERROR UI ================= */

        function showError(message) {

            content.innerHTML = `

                <div class="error-card">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <h2>
                        Something went wrong
                    </h2>

                    <p>
                        ${message}
                    </p>

                    <a
                        href="search.html?type=location"
                        class="btn btn-primary"
                    >
                        ← Back to Location Search
                    </a>

                </div>

            `;

        }


        /* ================= START ================= */

        loadLocation();

    </script>

</body>
</html>
