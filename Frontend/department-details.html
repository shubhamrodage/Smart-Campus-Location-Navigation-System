<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Department Details | Smart Campus Navigator
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: #123b78;
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            border-radius: 10px;

            background: #123b78;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            font-size: 10px;
            color: #64748b;

            letter-spacing: 1.2px;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-links a {
            text-decoration: none;

            color: #475569;

            font-size: 14px;
            font-weight: 600;

            padding: 10px 14px;

            border-radius: 8px;

            transition: 0.25s ease;
        }

        .nav-links a:hover {
            background: #eef4ff;
            color: #123b78;
        }

        .logout-btn {
            border: none;

            background: #123b78;
            color: white;

            padding: 10px 15px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .logout-btn:hover {
            background: #0d2f63;
        }

        /* ================= HERO ================= */

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #123b78,
                    #1d5fbf
                );

            padding: 52px 20px 70px;

            text-align: center;

            color: white;

            position: relative;

            overflow: hidden;
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            top: -130px;
            right: 8%;
        }

        .hero::after {
            content: "";

            position: absolute;

            width: 200px;
            height: 200px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            bottom: -110px;
            left: 8%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 16px;

            border-radius: 16px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;

            backdrop-filter: blur(5px);
        }

        .hero h1 {
            font-size: 34px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .hero p {
            font-size: 15px;
            opacity: 0.88;
        }

        /* ================= MAIN ================= */

        .main-container {
            max-width: 1050px;

            margin: -38px auto 60px;

            padding: 0 20px;

            position: relative;

            z-index: 5;
        }

        /* ================= CARD ================= */

        .details-card {
            background: white;

            border-radius: 18px;

            box-shadow:
                0 15px 45px
                rgba(
                    15,
                    23,
                    42,
                    0.10
                );

            overflow: hidden;

            animation:
                fadeUp 0.5s ease;
        }

        /* ================= CARD HEADER ================= */

        .card-header {
            padding: 30px 32px;

            display: flex;
            align-items: center;

            gap: 18px;
        }

        .department-icon {
            width: 62px;
            height: 62px;

            border-radius: 15px;

            background: #eef4ff;

            color: #1754a6;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 29px;

            flex-shrink: 0;
        }

        .detail-label {
            color: #64748b;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.7px;

            margin-bottom: 5px;
        }

        .card-header h2 {
            color: #172554;

            font-size: 25px;

            margin-bottom: 8px;

            line-height: 1.3;
        }

        .department-badge {
            display: inline-block;

            background: #eaf2ff;

            color: #1754a6;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }

        .divider {
            height: 1px;

            background: #edf0f5;

            margin: 0 32px;
        }

        /* ================= INFO GRID ================= */

        .info-grid {
            padding: 30px 32px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        .info-box {
            background: #f8fafc;

            border: 1px solid #e8edf3;

            border-radius: 12px;

            padding: 18px;

            display: flex;

            align-items: flex-start;

            gap: 13px;

            transition: 0.25s ease;
        }

        .info-box:hover {
            transform: translateY(-2px);

            border-color: #cbdcf5;

            box-shadow:
                0 5px 15px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );
        }

        .info-icon {
            font-size: 21px;
        }

        .info-label {
            color: #64748b;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            margin-bottom: 6px;
        }

        .info-value {
            color: #172554;

            font-size: 14px;

            font-weight: 700;

            line-height: 1.5;

            word-break: break-word;
        }

        /* ================= DESCRIPTION ================= */

        .description-box {
            margin: 0 32px 20px;

            padding: 22px;

            border-radius: 13px;

            background: #f8fafc;

            border: 1px solid #e8edf3;
        }

        .description-box h3 {
            color: #172554;

            font-size: 16px;

            margin-bottom: 8px;
        }

        .description-box p {
            color: #475569;

            font-size: 14px;

            line-height: 1.7;
        }

        /* ================= LOCATION ================= */

        .location-box {
            margin: 0 32px 28px;

            padding: 22px;

            border-radius: 13px;

            background: #f8fafc;

            border: 1px solid #e8edf3;
        }

        .location-box h3 {
            color: #172554;

            font-size: 16px;

            margin-bottom: 8px;
        }

        .location-box p {
            color: #475569;

            font-size: 14px;

            line-height: 1.7;
        }

        /* ================= ACTIONS ================= */

        .actions {
            padding: 0 32px 32px;

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px 20px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition: 0.25s ease;
        }

        .btn-primary {
            background: #123b78;

            color: white;

            box-shadow:
                0 5px 14px
                rgba(
                    18,
                    59,
                    120,
                    0.18
                );
        }

        .btn-primary:hover {
            background: #0d2f63;

            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f1f5f9;

            color: #334155;

            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;

            transform: translateY(-2px);
        }

        /* ================= ERROR ================= */

        .error-card {
            padding: 55px 25px;

            text-align: center;
        }

        .error-icon {
            font-size: 45px;

            margin-bottom: 15px;
        }

        .error-card h2 {
            color: #172554;

            margin-bottom: 8px;
        }

        .error-card p {
            color: #64748b;

            font-size: 14px;

            margin-bottom: 20px;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #ffffff;

            border-top: 1px solid #e5e7eb;

            padding: 28px 20px;

            text-align: center;
        }

        .footer-title {
            color: #123b78;

            font-size: 16px;

            font-weight: 800;

            margin-bottom: 6px;
        }

        .footer-text {
            color: #64748b;

            font-size: 13px;
        }

        .copyright {
            margin-top: 12px;

            color: #94a3b8;

            font-size: 11px;
        }

        /* ================= ANIMATION ================= */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 850px) {

            .info-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 2px;
            }

            .nav-links a {
                padding: 8px 9px;
                font-size: 12px;
            }

        }

        @media (max-width: 600px) {

            .navbar {
                height: auto;

                padding: 14px 18px;

                flex-wrap: wrap;

                gap: 12px;
            }

            .nav-links {
                width: 100%;

                justify-content: center;

                flex-wrap: wrap;
            }

            .brand-subtitle {
                display: none;
            }

            .hero {
                padding: 45px 20px 65px;
            }

            .hero h1 {
                font-size: 26px;
            }

            .hero p {
                font-size: 13px;
            }

            .main-container {
                padding: 0 14px;
            }

            .card-header {
                padding: 23px;
            }

            .card-header h2 {
                font-size: 21px;
            }

            .divider {
                margin: 0 23px;
            }

            .info-grid {
                padding: 23px;

                grid-template-columns: 1fr;
            }

            .description-box,
            .location-box {
                margin-left: 23px;
                margin-right: 23px;
            }

            .actions {
                padding:
                    0 23px 23px;

                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a
            href="dashboard.html"
            class="brand"
        >

            <div class="brand-icon">
                🏫
            </div>

            <div class="brand-text">

                <span class="brand-title">
                    SMART CAMPUS
                </span>

                <span class="brand-subtitle">
                    VIT PUNE
                </span>

            </div>

        </a>


        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="search.html?type=location">
                Locations
            </a>

            <a href="search.html?type=department">
                Departments
            </a>

            <a href="index.html">
                Home
            </a>

            <button
                class="logout-btn"
                id="logoutButton"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="hero-content">

            <div class="hero-icon">
                🎓
            </div>

            <h1>
                Smart Campus Navigator
            </h1>

            <p>
                Department Details
            </p>

        </div>

    </section>



    <!-- ================= MAIN ================= -->

    <main class="main-container">

        <div
            class="details-card"
            id="departmentDetails"
        >

            <div class="error-card">

                <div>
                    Loading department details...
                </div>

            </div>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-title">
            🏫 Smart Campus Navigator
        </div>

        <div class="footer-text">
            Smart way to explore your campus.
        </div>

        <div class="copyright">
            © 2026 Smart Campus Navigator.
            All rights reserved.
        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // ==========================================
        // API URL
        // ==========================================

        const API_URL =
            "http://127.0.0.1:8080/api/departments";


        // ==========================================
        // GET DEPARTMENT ID
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const departmentId =
            urlParams.get("id");


        // ==========================================
        // CONTAINER
        // ==========================================

        const container =
            document.getElementById(
                "departmentDetails"
            );


        // ==========================================
        // LOGOUT
        // ==========================================

        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                function()
                {

                    localStorage.removeItem(
                        "isLoggedIn"
                    );

                    localStorage.removeItem(
                        "loggedInUserName"
                    );

                    localStorage.removeItem(
                        "smartCampusUser"
                    );

                    window.location.href =
                        "login.html";

                }
            );


        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHTML(value)
        {

            if (
                value === null ||
                value === undefined
            )
            {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ==========================================
        // LOAD DEPARTMENT
        // ==========================================

        async function loadDepartmentDetails()
        {

            try
            {

                // ==============================
                // CHECK ID
                // ==============================

                if (!departmentId)
                {

                    showError(
                        "Department ID not found.",
                        "Please open the department from the Department Search page."
                    );

                    return;

                }


                // ==============================
                // FETCH API
                // ==============================

                const response =
                    await fetch(
                        API_URL +
                        "?t=" +
                        Date.now()
                    );


                if (!response.ok)
                {

                    throw new Error(
                        "Backend response error: " +
                        response.status
                    );

                }


                // ==============================
                // JSON
                // ==============================

                const data =
                    await response.json();


                console.log(
                    "Department API Data:",
                    data
                );


                // ==============================
                // CHECK ARRAY
                // ==============================

                if (
                    !data ||
                    !Array.isArray(
                        data.departments
                    )
                )
                {

                    throw new Error(
                        "Invalid department API response"
                    );

                }


                // ==============================
                // FIND DEPARTMENT
                // ==============================

                const department =
                    data.departments.find(
                        function(item)
                        {

                            return (
                                String(item.id)
                                    .trim()
                                ===
                                String(departmentId)
                                    .trim()
                            );

                        }
                    );


                // ==============================
                // NOT FOUND
                // ==============================

                if (!department)
                {

                    showError(
                        "Department Not Found",
                        "The requested department could not be found."
                    );

                    return;

                }


                // ==============================
                // DISPLAY
                // ==============================

                displayDepartment(
                    department
                );

            }

            catch (error)
            {

                console.error(
                    "Department Error:",
                    error
                );


                showError(
                    "Unable to Load Department",
                    "Please make sure the C++ backend server is running."
                );

            }

        }


        // ==========================================
        // DISPLAY DEPARTMENT
        // ==========================================

        function displayDepartment(
            department
        )
        {

            container.innerHTML = `

                <div class="card-header">

                    <div class="department-icon">
                        🎓
                    </div>

                    <div>

                        <div class="detail-label">
                            DEPARTMENT DETAILS
                        </div>

                        <h2>
                            ${escapeHTML(
                                department.name
                            )}
                        </h2>

                        <span class="department-badge">

                            ${escapeHTML(
                                department.shortName ||
                                "Department"
                            )}

                        </span>

                    </div>

                </div>


                <div class="divider">
                </div>


                <div class="info-grid">


                    <!-- DEPARTMENT ID -->

                    <div class="info-box">

                        <div class="info-icon">
                            🆔
                        </div>

                        <div>

                            <div class="info-label">
                                Department ID
                            </div>

                            <div class="info-value">
                                ${escapeHTML(
                                    department.id
                                )}
                            </div>

                        </div>

                    </div>


                    <!-- SHORT NAME -->

                    <div class="info-box">

                        <div class="info-icon">
                            🏷️
                        </div>

                        <div>

                            <div class="info-label">
                                Short Name
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    department.shortName ||
                                    "N/A"
                                )}

                            </div>

                        </div>

                    </div>


                    <!-- BUILDING -->

                    <div class="info-box">

                        <div class="info-icon">
                            🏢
                        </div>

                        <div>

                            <div class="info-label">
                                Building
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    department.building ||
                                    "N/A"
                                )}

                            </div>

                        </div>

                    </div>


                    <!-- FLOOR -->

                    <div class="info-box">

                        <div class="info-icon">
                            📶
                        </div>

                        <div>

                            <div class="info-label">
                                Floor
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    department.floor ??
                                    "N/A"
                                )}

                            </div>

                        </div>

                    </div>


                    <!-- HOD -->

                    <div class="info-box">

                        <div class="info-icon">
                            👨‍💼
                        </div>

                        <div>

                            <div class="info-label">
                                HOD
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    department.hod ||
                                    "Not Assigned"
                                )}

                            </div>

                        </div>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="info-box">

                        <div class="info-icon">
                            🏛️
                        </div>

                        <div>

                            <div class="info-label">
                                Department
                            </div>

                            <div class="info-value">

                                ${escapeHTML(
                                    department.shortName ||
                                    "N/A"
                                )}

                            </div>

                        </div>

                    </div>


                </div>


                <!-- DESCRIPTION -->

                <div class="description-box">

                    <h3>
                        📝 Description
                    </h3>

                    <p>

                        ${escapeHTML(
                            department.description ||
                            "No description available."
                        )}

                    </p>

                </div>


                <!-- LOCATION -->

                <div class="location-box">

                    <h3>
                        📍 Department Location
                    </h3>

                    <p>

                        ${escapeHTML(
                            department.name
                        )}

                        is located in Building

                        ${escapeHTML(
                            department.building ||
                            "N/A"
                        )},

                        Floor

                        ${escapeHTML(
                            department.floor ??
                            "N/A"
                        )}.

                    </p>

                </div>


                <!-- ACTIONS -->

                <div class="actions">

                    <a
                        href="search.html?type=department"
                        class="btn btn-secondary"
                    >
                        ← Back to Department Search
                    </a>


                    <a
                        href="navigation.html?type=department&id=${encodeURIComponent(
                            department.id
                        )}"
                        class="btn btn-primary"
                    >
                        🧭 Navigate
                    </a>

                </div>

            `;

        }


        // ==========================================
        // ERROR
        // ==========================================

        function showError(
            title,
            message
        )
        {

            container.innerHTML = `

                <div class="error-card">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <h2>
                        ${escapeHTML(title)}
                    </h2>

                    <p>
                        ${escapeHTML(message)}
                    </p>

                    <a
                        href="search.html?type=department"
                        class="btn btn-primary"
                    >
                        ← Back to Department Search
                    </a>

                </div>

            `;

        }


        // ==========================================
        // START
        // ==========================================

        loadDepartmentDetails();

    </script>

</body>

</html>
